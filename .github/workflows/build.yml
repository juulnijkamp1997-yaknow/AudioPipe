name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # One signing key for every build, so a new APK installs as an update.
      # The key never goes into the repository: it lives in the Actions cache.
      # A cache entry unused for seven days is deleted; the next build then makes a
      # new key, and that one update needs an uninstall first.
      - name: Restore signing key
        id: signing-key
        uses: actions/cache@v5
        with:
          path: signing/audiopipe.keystore
          key: audiopipe-signing-key-v1

      - name: Create signing key on first run
        if: steps.signing-key.outputs.cache-hit != 'true'
        run: |
          mkdir -p signing
          keytool -genkeypair -noprompt \
            -keystore signing/audiopipe.keystore -storetype PKCS12 \
            -storepass audiopipe -keypass audiopipe -alias audiopipe \
            -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=AudioPipe"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PbuildNumber=${{ github.run_number }} --no-daemon --stacktrace

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AudioPipe-root.apk
          gh release create "build-${{ github.run_number }}" AudioPipe-root.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "AudioPipe root 1.0.${{ github.run_number }}" \
            --notes "Debug build of commit ${{ github.sha }}"
