name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Same debug signing key for every build, so a new APK installs as an
      # update instead of needing an uninstall first.
      - name: Reuse debug signing key
        uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PbuildNumber=${{ github.run_number }} --no-daemon --stacktrace

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AudioPipe-root.apk
          gh release create "build-${{ github.run_number }}" AudioPipe-root.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "AudioPipe root 1.0.${{ github.run_number }}" \
            --notes "Debug build of commit ${{ github.sha }}"
